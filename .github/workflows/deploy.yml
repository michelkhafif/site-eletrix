name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run seo:check
      # Padrão = ambiente de teste (basePath /site-eletrix, noindex, robots.txt com Disallow: /).
      # Lançamento: crie a variável do repositório SITE_ENV=production (ver GO-LIVE.md) e o build
      # passa a sair para https://eletrix.mobi, sem basePath, indexável e com sitemap.
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ vars.SITE_ENV != 'production' && '/site-eletrix' || '' }}
          NEXT_PUBLIC_SITE_ENV: ${{ vars.SITE_ENV == 'production' && 'production' || 'test' }}
      - run: npm run links:check
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ vars.SITE_ENV != 'production' && '/site-eletrix' || '' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
